# Generate ScoringSpades.xcodeproj with:  cd ios && xcodegen
name: ScoringSpades
options:
  bundleIdPrefix: com.scoringspades
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: NQ6AJVVBBJ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  ScoringSpades:
    type: application
    platform: iOS
    sources:
      - path: ScoringSpades
      # The website itself, bundled as-is so the app works offline and never
      # drifts from scoringspades.com.
      - path: ../public
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scoringspades.app
        PRODUCT_NAME: ScoringSpades
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: ScoringSpades/Info.plist
      properties:
        CFBundleDisplayName: Spades
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.card-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ScoringSpadesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScoringSpadesUITests
    dependencies:
      - target: ScoringSpades
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scoringspades.app.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScoringSpades:
    build:
      targets:
        ScoringSpades: all
    test:
      targets:
        - ScoringSpadesUITests
    archive:
      config: Release
