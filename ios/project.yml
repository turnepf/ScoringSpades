# Generate ScoringSpades.xcodeproj with:  cd ios && xcodegen
name: ScoringSpades
options:
  bundleIdPrefix: com.scoringspades
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: NQ6AJVVBBJ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
targets:
  ScoringSpades:
    type: application
    platform: iOS
    sources:
      - path: ScoringSpades
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scoringspades.app
        PRODUCT_NAME: ScoringSpades
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    entitlements:
      path: ScoringSpades/ScoringSpades.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:scoringspades.com
    info:
      path: ScoringSpades/Info.plist
      properties:
        CFBundleDisplayName: Spades
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.card-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ScoringSpadesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScoringSpadesTests
    dependencies:
      - target: ScoringSpades
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scoringspades.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ScoringSpades.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ScoringSpades
        BUNDLE_LOADER: $(TEST_HOST)
  ScoringSpadesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScoringSpadesUITests
    dependencies:
      - target: ScoringSpades
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scoringspades.app.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScoringSpades:
    build:
      targets:
        ScoringSpades: all
    test:
      targets:
        - ScoringSpadesTests
        - ScoringSpadesUITests
    archive:
      config: Release
